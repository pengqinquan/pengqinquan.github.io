<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPC 答题模板库 | 算法竞赛模板</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #1a1a2e;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo i {
            font-size: 1.8rem;
            color: #667eea;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.2rem;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-input {
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            width: 250px;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
            width: 300px;
        }

        /* 主要内容区 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 面包屑 */
        .breadcrumb-wrapper {
            margin-bottom: 2rem;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            display: inline-flex;
        }

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .breadcrumb-item:hover {
            opacity: 0.8;
        }

        .breadcrumb-item i {
            font-size: 0.8rem;
        }

        .breadcrumb-separator {
            color: rgba(255,255,255,0.5);
        }

        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card i {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 0.75rem;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-label {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* 文件网格 */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .file-card {
            background: white;
            border-radius: 16px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        .file-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #1a1a2e;
            word-break: break-word;
        }

        .file-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #f0f0f0;
        }

        .file-type-badge {
            background: #f0f0f0;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: #ccc;
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: #999;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                text-align: center;
            }
            .search-input, .search-input:focus {
                width: 200px;
            }
            .main-container {
                padding: 1rem;
            }
            .stats-cards {
                grid-template-columns: 1fr;
            }
            .files-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 加载动画 */
        .loading-spinner {
            text-align: center;
            padding: 4rem;
        }

        .loading-spinner i {
            font-size: 3rem;
            color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-code"></i>
                <div>
                    <h1>CCPC 答题模板库</h1>
                    <p>算法竞赛模板 | 数据结构 | 高精度计算</p>
                </div>
            </div>
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索模板...">
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="breadcrumb-wrapper">
            <div class="breadcrumb" id="breadcrumb"></div>
        </div>

        <div class="stats-cards" id="statsCards">
            <div class="stat-card">
                <i class="fas fa-folder"></i>
                <div class="stat-number" id="folderCount">0</div>
                <div class="stat-label">文件夹</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-file-code"></i>
                <div class="stat-number" id="fileCount">0</div>
                <div class="stat-label">代码文件</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-file-pdf"></i>
                <div class="stat-number" id="pdfCount">0</div>
                <div class="stat-label">PDF 题目</div>
            </div>
        </div>

        <div id="fileList" class="files-grid"></div>
    </div>

    <div class="footer">
        <p>© 2024 CCPC 答题模板库 | 持续更新中</p>
    </div>

    <script>
        // ==================== 文件树配置（请根据实际情况修改）====================
        const FILE_TREE = [
            {
                name: "高精度加法",
                type: "folder",
                path: "高精度加法",
                icon: "fa-folder",
                children: [
                    {
                        name: "模板",
                        type: "folder",
                        path: "高精度加法/模板",
                        children: [
                            { name: "高精度加法.cpp", type: "file", path: "高精度加法/模板/高精度加法.cpp", size: "1.2 KB", ext: "cpp" }
                        ]
                    },
                    { name: "高精度加法.pdf", type: "file", path: "高精度加法/高精度加法.pdf", size: "51 KB", ext: "pdf" }
                ]
            },
            {
                name: "数据结构",
                type: "folder",
                path: "数据结构",
                icon: "fa-folder-tree",
                children: [
                    {
                        name: "栈",
                        type: "folder",
                        path: "数据结构/栈",
                        children: [
                            { name: "后置表达式计算", type: "folder", path: "数据结构/栈/后置表达式计算", children: [] },
                            { name: "括号配比问题", type: "folder", path: "数据结构/栈/括号配比问题", children: [] },
                            { name: "stl之中的操作指令.txt", type: "file", path: "数据结构/栈/stl之中的操作指令.txt", size: "1 KB", ext: "txt" }
                        ]
                    }
                ]
            }
        ];

        let currentPath = [];
        let allItems = [];

        // 获取文件图标
        function getFileIcon(item) {
            if (item.type === "folder") return '<i class="fas fa-folder"></i>';
            if (item.ext === "cpp") return '<i class="fas fa-file-code"></i>';
            if (item.ext === "pdf") return '<i class="fas fa-file-pdf"></i>';
            if (item.ext === "txt") return '<i class="fas fa-file-alt"></i>';
            return '<i class="fas fa-file"></i>';
        }

        // 获取文件图标样式类
        function getIconColor(item) {
            if (item.type === "folder") return "#667eea";
            if (item.ext === "cpp") return "#e83e8c";
            if (item.ext === "pdf") return "#dc3545";
            return "#6c757d";
        }

        // 获取当前路径下的内容
        function getCurrentContents(pathArray) {
            if (pathArray.length === 0) return FILE_TREE;
            let current = FILE_TREE;
            for (let i = 0; i < pathArray.length; i++) {
                let found = null;
                for (let j = 0; j < current.length; j++) {
                    if (current[j].name === pathArray[i] && current[j].type === "folder") {
                        found = current[j];
                        break;
                    }
                }
                if (!found || !found.children) return [];
                current = found.children;
            }
            return current;
        }

        // 更新统计数字
        function updateStats(items) {
            let folders = 0, files = 0, pdfs = 0;
            function count(items) {
                for (let item of items) {
                    if (item.type === "folder") {
                        folders++;
                        if (item.children) count(item.children);
                    } else {
                        files++;
                        if (item.ext === "pdf") pdfs++;
                    }
                }
            }
            count(items);
            document.getElementById('folderCount').innerText = folders;
            document.getElementById('fileCount').innerText = files;
            document.getElementById('pdfCount').innerText = pdfs;
        }

        // 渲染文件网格
        function renderFileList() {
            const contents = getCurrentContents(currentPath);
            const container = document.getElementById('fileList');
            const breadcrumb = document.getElementById('breadcrumb');

            // 更新统计（只在根目录显示完整统计）
            if (currentPath.length === 0) {
                updateStats(FILE_TREE);
            }

            // 渲染面包屑
            let breadHtml = `<div class="breadcrumb-item" onclick="goToPath([])"><i class="fas fa-home"></i> 首页</div>`;
            let tempPath = [];
            for (let i = 0; i < currentPath.length; i++) {
                tempPath.push(currentPath[i]);
                breadHtml += `<span class="breadcrumb-separator"><i class="fas fa-chevron-right"></i></span>`;
                breadHtml += `<div class="breadcrumb-item" onclick="goToPath(${JSON.stringify(tempPath)})">${currentPath[i]}</div>`;
            }
            breadcrumb.innerHTML = breadHtml;

            // 渲染文件列表
            if (!contents || contents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>此文件夹为空</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (let i = 0; i < contents.length; i++) {
                const item = contents[i];
                const isFolder = item.type === "folder";
                const iconColor = getIconColor(item);

                let metaHtml = '';
                if (isFolder) {
                    metaHtml = `<span class="file-type-badge"><i class="fas fa-folder"></i> 文件夹</span>`;
                } else {
                    metaHtml = `
                        <span class="file-type-badge">${item.ext.toUpperCase()}</span>
                        <span>${item.size || '—'}</span>
                    `;
                }

                html += `
                    <div class="file-card" onclick="${isFolder ? `goToPath(${JSON.stringify([...currentPath, item.name])})` : `openFile('${item.path}')`}">
                        <div class="file-icon" style="color: ${iconColor}">
                            ${getFileIcon(item)}
                        </div>
                        <div class="file-name">${item.name}</div>
                        <div class="file-meta">
                            ${metaHtml}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // 跳转路径
        window.goToPath = function(pathArray) {
            currentPath = pathArray;
            renderFileList();
            // 清空搜索框
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
        };

        // 打开文件
        window.openFile = function(path) {
            const rawUrl = `https://raw.githubusercontent.com/pengqinquan/jisuali.github.io/main/${path}`;

            if (path.endsWith('.cpp') || path.endsWith('.c') || path.endsWith('.h') || path.endsWith('.txt')) {
                window.open(`viewer.html?file=${encodeURIComponent(path)}`, '_blank');
            } else {
                window.open(rawUrl, '_blank');
            }
        };

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();

            if (!keyword) {
                renderFileList();
                document.getElementById('statsCards').style.display = 'grid';
                return;
            }

            document.getElementById('statsCards').style.display = 'none';

            // 递归搜索
            function searchItems(items, results) {
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.name.toLowerCase().includes(keyword)) {
                        results.push({ ...item, searchResult: true });
                    }
                    if (item.children && item.children.length > 0) {
                        searchItems(item.children, results);
                    }
                }
            }

            const searchResults = [];
            searchItems(FILE_TREE, searchResults);

            const container = document.getElementById('fileList');
            if (searchResults.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>没有找到 "${keyword}" 相关内容</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (let i = 0; i < searchResults.length; i++) {
                const item = searchResults[i];
                const isFolder = item.type === "folder";
                const iconColor = getIconColor(item);

                let metaHtml = '';
                if (isFolder) {
                    metaHtml = `<span class="file-type-badge"><i class="fas fa-folder"></i> 文件夹</span>`;
                } else {
                    metaHtml = `
                        <span class="file-type-badge">${item.ext.toUpperCase()}</span>
                        <span>${item.size || '—'}</span>
                    `;
                }

                const onClick = isFolder
                    ? `goToPath([${JSON.stringify(item.name)}])`
                    : `openFile('${item.path}')`;

                html += `
                    <div class="file-card" onclick="${onClick}">
                        <div class="file-icon" style="color: ${iconColor}">
                            ${getFileIcon(item)}
                        </div>
                        <div class="file-name">${item.name}</div>
                        <div class="file-meta">
                            ${metaHtml}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;

            // 更新面包屑
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = `<div class="breadcrumb-item" onclick="goToPath([])"><i class="fas fa-home"></i> 首页</div><span class="breadcrumb-separator"><i class="fas fa-chevron-right"></i></span><div class="breadcrumb-item">🔍 搜索结果</div>`;
        });

        // 初始化
        renderFileList();
    </script>
</body>
</html>
