<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CCPC 答题模板库</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .folder {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
        }
        .folder:hover {
            background: #f0f0f0;
        }
        .file {
            background: #f8f9fa;
            padding: 10px 15px;
            margin: 5px 0 5px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .back {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 CCPC 答题模板库</h1>
            <p>算法竞赛模板 | 数据结构 | 高精度计算</p>
        </div>
        
        <div id="content"></div>
    </div>

    <script>
        const data = {
            '高精度加法': {
                type: 'folder',
                children: {
                    '高精度加法.cpp': { type: 'file', ext: 'cpp' },
                    '高精度加法.pdf': { type: 'file', ext: 'pdf' }
                }
            },
            '数据结构': {
                type: 'folder',
                children: {
                    '栈': {
                        type: 'folder',
                        children: {
                            '括号配比问题.cpp': { type: 'file', ext: 'cpp' }
                        }
                    }
                }
            }
        };
        
        let currentPath = [];
        
        function getCurrent() {
            let current = data;
            for (let i = 0; i < currentPath.length; i++) {
                current = current[currentPath[i]].children;
            }
            return current;
        }
        
        function render() {
            const current = getCurrent();
            const contentDiv = document.getElementById('content');
            
            let html = '';
            
            if (currentPath.length > 0) {
                html += '<button class="back" onclick="goBack()">← 返回上级</button>';
            }
            
            for (let name in current) {
                const item = current[name];
                if (item.type === 'folder') {
                    html += `<div class="folder" onclick="openFolder('${name}')">📁 ${name}</div>`;
                } else {
                    html += `<div class="file" onclick="openFile('${name}')">📄 ${name}</div>`;
                }
            }
            
            contentDiv.innerHTML = html;
        }
        
        function openFolder(name) {
            currentPath.push(name);
            render();
        }
        
        function goBack() {
            currentPath.pop();
            render();
        }
        
        function openFile(name) {
            alert('打开文件: ' + name);
        }
        
        render();
    </script>
</body>
</html>
