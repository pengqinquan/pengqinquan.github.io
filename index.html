<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码查看器 - CCPC模板库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title i {
            font-size: 1.5rem;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: #e0e0e0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 30px;
        }
        .code-card {
            background: #0d1117;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .code-header {
            background: #161b22;
            padding: 12px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filename {
            color: #c9d1d9;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        pre {
            margin: 0;
            padding: 20px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }
        .error {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: #dc3545;
        }
        @media (max-width: 600px) {
            pre { padding: 12px; font-size: 11px; }
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-link">← 返回模板库</a>
        
        <div class="code-card" id="codeCard">
            <div class="code-header">
                <div class="filename" id="filename">
                    <i class="file-icon">📄</i> 加载中...
                </div>
                <div class="btn-group">
                    <button class="btn" id="copyBtn">📋 复制代码</button>
                    <button class="btn" id="downloadBtn">💾 下载文件</button>
                </div>
            </div>
            <div id="content">
                <div style="text-align: center; padding: 50px; color: #888;">
                    <i>⏳ 加载代码中...</i>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
        
        const USER = 'pengqinquan';
        const REPO = 'pengqinquan.github.io';
        const BRANCH = 'main';
        
        function getRawUrl(path) {
            return `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${path}`;
        }
        
        function escapeHtml(text) {
            return text.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        async function load() {
            let filePath = getUrlParam('file');
            
            if (!filePath) {
                document.getElementById('content').innerHTML = '<div class="error">❌ 未指定文件</div>';
                document.getElementById('filename').innerHTML = '<i class="file-icon">❌</i> 错误';
                return;
            }
            
            filePath = decodeURIComponent(filePath);
            const fileName = filePath.split('/').pop();
            document.title = `${fileName} - CCPC模板库`;
            
            const icon = fileName.endsWith('.cpp') ? '📝' : (fileName.endsWith('.pdf') ? '📕' : '📄');
            document.getElementById('filename').innerHTML = `<i class="file-icon">${icon}</i> ${fileName}`;
            
            try {
                const url = getRawUrl(filePath);
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const code = await response.text();
                
                let lang = 'text';
                if (fileName.endsWith('.cpp')) lang = 'cpp';
                else if (fileName.endsWith('.c')) lang = 'c';
                else if (fileName.endsWith('.h')) lang = 'cpp';
                else if (fileName.endsWith('.py')) lang = 'python';
                else if (fileName.endsWith('.java')) lang = 'java';
                
                const html = `<pre><code class="language-${lang}">${escapeHtml(code)}</code></pre>`;
                document.getElementById('content').innerHTML = html;
                hljs.highlightAll();
                window.currentCode = code;
            } catch (error) {
                document.getElementById('content').innerHTML = `<div class="error">❌ 加载失败: ${error.message}</div>`;
            }
        }
        
        document.getElementById('copyBtn').addEventListener('click', async () => {
            if (window.currentCode) {
                await navigator.clipboard.writeText(window.currentCode);
                const btn = document.getElementById('copyBtn');
                btn.innerHTML = '✅ 已复制';
                setTimeout(() => btn.innerHTML = '📋 复制代码', 2000);
            }
        });
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            let filePath = getUrlParam('file');
            if (filePath) {
                filePath = decodeURIComponent(filePath);
                const a = document.createElement('a');
                a.href = getRawUrl(filePath);
                a.download = filePath.split('/').pop();
                a.click();
            }
        });
        
        load();
    </script>
</body>
